name: CD Prod (Web)

# PROD web deploy — tag/manual gated, same as the API prod workflow.
# Prod-specific values (bucket, distribution, Cognito, URLs) come from repo
# VARIABLES so this file never needs editing when the prod stack changes:
#   vars.PROD_S3_BUCKET, vars.PROD_CLOUDFRONT_DISTRIBUTION_ID,
#   vars.PROD_COGNITO_DOMAIN, vars.PROD_COGNITO_CLIENT_ID,
#   vars.PROD_REDIRECT_URI, vars.PROD_LOGOUT_URI,
#   vars.AWS_DEPLOY_ROLE_ARN_PROD
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: cd-web-prod
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-2
  S3_BUCKET: ${{ vars.PROD_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
  VITE_API_BASE_URL: ""
  VITE_COGNITO_DOMAIN: ${{ vars.PROD_COGNITO_DOMAIN }}
  VITE_COGNITO_CLIENT_ID: ${{ vars.PROD_COGNITO_CLIENT_ID }}
  VITE_COGNITO_REDIRECT_URI: ${{ vars.PROD_REDIRECT_URI }}
  VITE_COGNITO_LOGOUT_URI: ${{ vars.PROD_LOGOUT_URI }}

jobs:
  deploy:
    name: Build & Deploy Web (PROD)
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC → PROD)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "brand/*"
          aws s3 sync dist/brand/ "s3://$S3_BUCKET/brand/" \
            --cache-control "public,max-age=86400"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
