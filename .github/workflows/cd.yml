name: CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: neocloud-dev-api
  ECS_CLUSTER: neocloud-dev-cluster
  ECS_SERVICE: neocloud-dev-api
  ECS_CONTAINER: api

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    # Protect production deploys behind a GitHub Environment (optional).
    environment: dev
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query 'taskDefinition' --output json > taskdef.json
          # Point the container at the freshly pushed image and strip read-only fields.
          python - "$ECS_CONTAINER" "${{ steps.build.outputs.image }}" <<'PY'
          import json, sys
          container, image = sys.argv[1], sys.argv[2]
          td = json.load(open("taskdef.json"))
          for c in td["containerDefinitions"]:
              if c["name"] == container:
                  c["image"] = image
          for k in ["taskDefinitionArn","revision","status","requiresAttributes",
                    "compatibilities","registeredAt","registeredBy"]:
              td.pop(k, None)
          json.dump(td, open("taskdef.new.json","w"))
          PY

      - name: Register & deploy
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Deployment stable."
