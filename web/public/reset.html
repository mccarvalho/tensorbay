<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoCloud — Reset</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0221;
        color: #b9a9d6;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 460px;
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1rem;
        background: #241043;
      }
      h1 { color: #fff; font-size: 1.25rem; margin: 0.5rem 0; }
      .eyebrow {
        color: #00d4ff;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.72rem;
        font-weight: 700;
      }
      #log { font-size: 0.85rem; margin-top: 1rem; white-space: pre-line; }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.6rem 1.2rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #b165fb, #00d4ff);
        color: #0d0221;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">NeoCloud · Maintenance</div>
      <h1>Resetting the app cache…</h1>
      <div id="log">Working…</div>
      <a id="go" href="/">Open NeoCloud</a>
    </div>
    <script>
      (async function () {
        const log = document.getElementById('log');
        const steps = [];
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
            steps.push('✓ Service workers removed (' + regs.length + ')');
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
            steps.push('✓ Caches cleared (' + keys.length + ')');
          }
          try {
            localStorage.clear();
            sessionStorage.clear();
            steps.push('✓ Local/session storage cleared');
          } catch (e) {
            steps.push('• storage clear skipped');
          }
          steps.push('\nDone. Redirecting to sign-in…');
          log.textContent = steps.join('\n');
          setTimeout(() => location.replace('/login'), 1500);
        } catch (e) {
          log.textContent =
            'Reset ran with a warning: ' + e + '\nClick the button below.';
        }
      })();
    </script>
  </body>
</html>
